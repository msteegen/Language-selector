<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="langTitle"></title>

    <script src="language.js"></script>
    <script>
    // Apply direction immediately to prevent layout jump on load
    const savedLang = localStorage.getItem('language') || 'en';
    document.documentElement.dir = (savedLang === 'ar') ? 'rtl' : 'ltr';
    document.documentElement.lang = savedLang;
    </script>

</head>
<body>
    
<!-- Language Switcher -->
        <div class="setting-group">
            <label>Language</label>
            <div class="sidebar-btn-group">
                <button class="mobile-action lang-btn" data-type="language" data-value="en" id="lang-en">EN</button>
                <button class="mobile-action lang-btn" data-type="language" data-value="nl" id="lang-nl">NL</button>
            </div>
        </div>

</body>
</html>
