<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="Title"></title>

    <script src="language.js" defer></script>
    <script>
    // Apply direction immediately to prevent layout jump on load
    const savedLang = localStorage.getItem('language') || 'en';
    document.documentElement.dir = (savedLang === 'ar') ? 'rtl' : 'ltr';
    document.documentElement.lang = savedLang;
    </script>

</head>
<body>
    
<!-- Language Selector Links -->
    <nav>
        <ul>
            <li>
                <a href="#" class="mobile-action lang-btn" id="lang-en" data-type="language" data-value="en">English</a>
            </li>
            <li>
                <a href="#" class="mobile-action lang-btn" id="lang-nl" data-type="language" data-value="nl">Nederlands</a>
            </li>
        </ul>
    </nav>

    <!-- Translatable Content Examples -->
    <main>
        <!-- Standard text elements: data-i18n matches JSON keys -->
        <h1 data-i18n="welcome_title"></h1>
        <p data-i18n="home_description"></p>
        <p data-i18n="app-decs"></p>
        <p data-i18n="date"></p>

    </main>
</body>
</html>
